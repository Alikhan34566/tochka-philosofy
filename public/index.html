.yrs{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 10px;color:var(--acc);margin:0 6px 8px 0}

.lvl h4{margin:14px 0 8px;font:600 13px Inter,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

.back{display:inline-block;margin:20px 0 8px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.blk h3{font-size:18px}.blk p{margin:.4em 0}
blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--acc)}blockquote small{display:block;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 16px}
.tl{display:block;margin:6px 0;text-decoration:none;color:var(--ink);font-size:13px}.tl i{display:block;height:8px;background:var(--acc);border-radius:4px;margin-top:2px}.glt{min-height:24px;margin:8px 0 0}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}#app>*{animation:fi .35s ease}@media(prefers-reduced-motion:reduce){#app>*{animation:none}}

fact:'Абай писал музыку, читал русскую литературу и переводил её на казахский.',deep:[['Жизнь и путь','Абай родился в 1845 году в семье влиятельного рода. Его учили в медресе, а позже он познакомился с русской культурой и общался с политическими ссыльными, которые приносили ему идеи и книги. Долгие годы он занимался управлением и родовыми спорами, а зрелым поэтом стал ближе к сорока годам.||Поздние годы он посвятил стихам, переводам и «Словам назидания», где подводит итог своим размышлениям о человеке.'],['Что его вдохновило','Три источника. Первый: казахская устная поэзия, жырау и айтыс, из которых он вырос. Второй: восточные поэты, которых читали в степи, такие как Низами, Навои и Физули. Третий: русская литература, прежде всего Пушкин и Лермонтов, которых он переводил.||Главным толчком было разочарование: он видел, как родовая борьба, зависть и невежество мешают людям жить достойно, и искал, на что опереться.'],['Почему это важно для цепочки','Абай соединил степную традицию с письменной культурой и дал казахской поэзии новый голос: личный, думающий, спорящий с самим собой. Поэтому к нему возвращаются поздние авторы, когда говорят о совести, знании и смысле жизни.']],ev:['ok','Подтверждено','Переводы, собственные тексты и воспоминания современников подтверждают его источники вдохновения. Это самый надёжный пункт цепочки.']},
